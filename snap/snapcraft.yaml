name: lucidgrasp
base: core24
# The version is read from CMakeLists.txt (project(... VERSION ...)) so a
# release only ever has to bump one place. See override-pull below.
adopt-info: lucidgrasp
icon: snap/gui/lucidgrasp.png
license: MIT
summary: High-performance image search engine
description: |
  LucidGrasp is a high-performance image search engine that finds visually
  similar images across local folders or an entire filesystem. It combines
  SSIM structural similarity, ORB keypoint matching, and color histogram
  intersection into a single similarity percentage, and can detect edited
  copies that have been color graded, contrast adjusted, or filtered.
  Indexing and searching run on background threads and stay responsive on
  libraries of any size.

grade: stable
confinement: strict
platforms:
  amd64:

# The `gnome` extension provides the desktop launch wrapper, GTK theming,
# portals and the Mesa/GL stack on core24. Qt itself is staged explicitly
# below (the Qt libraries plus the QPA platform plugins).
apps:
  lucidgrasp:
    command: usr/bin/LucidGrasp
    extensions: [ gnome ]
    desktop: usr/share/applications/io.github.dialga_cmd.LucidGrasp.desktop
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  lucidgrasp:
    plugin: cmake
    # Built from the checked-out release tag by CI, so the snap always matches
    # the source that was released.
    source: .
    build-packages:
      - g++
      - make
      - pkg-config
      - qt6-base-dev
      - libopencv-dev
    # Runtime libraries pulled from the core24 (Ubuntu 24.04) archive so the
    # snap is self-contained. Note the t64 suffix and the .so.406 OpenCV soname.
    # qt6-qpa-plugins is what actually lets a Qt6 GUI start (libqxcb.so and the
    # Wayland plugin); imgcodecs is what imread() needs.
    stage-packages:
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6widgets6t64
      - libqt6network6t64
      - libqt6dbus6t64
      - libqt6opengl6t64
      - qt6-qpa-plugins
      - libopencv-core406
      - libopencv-imgproc406
      - libopencv-imgcodecs406
      - libopencv-features2d406
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    override-pull: |
      craftctl default
      version="$(sed -n 's/^project(LucidGrasp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
      craftctl set version="$version"