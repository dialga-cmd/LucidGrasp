name: lucidgrasp
base: core24
adopt-info: lucidgrasp
icon: snap/gui/lucidgrasp.png
license: MIT
summary: High-performance image search engine
description: |
  LucidGrasp is a high-performance image search engine that finds visually
  similar images across local folders or an entire filesystem. It combines
  SSIM structural similarity, ORB keypoint matching, and color histogram
  intersection into a single similarity percentage, and can detect edited
  copies that have been color graded, contrast adjusted, or filtered.
  Indexing and searching run on background threads and stay responsive on
  libraries of any size.

grade: stable
confinement: strict
platforms:
  amd64:

apps:
  lucidgrasp:
    command: usr/bin/LucidGrasp
    extensions: [ gnome ]
    environment:
      QT_PLUGIN_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/plugins
    desktop: usr/share/applications/io.github.dialga_cmd.LucidGrasp.desktop
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  lucidgrasp:
    plugin: cmake
    source: .
    build-packages:
      - g++
      - make
      - pkg-config
      - curl
      - qt6-base-dev
      - libopencv-dev
    stage-packages:
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6widgets6t64
      - libqt6network6t64
      - libqt6dbus6t64
      - libqt6opengl6t64
      - qt6-qpa-plugins
      - qt6-image-formats-plugins
      - libopencv-core406
      - libopencv-imgproc406
      - libopencv-imgcodecs406
      - libopencv-features2d406
      - liblapack3
      - libblas3
      - libgomp1
    organize:
      usr/lib/x86_64-linux-gnu/blas/*: usr/lib/x86_64-linux-gnu/
      usr/lib/x86_64-linux-gnu/lapack/*: usr/lib/x86_64-linux-gnu/
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    override-build: |
      cd "$CRAFT_PART_SRC"
      ./fetch-onnxruntime.sh
      craftctl default
      install -d "$CRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu"
      cp -aL third_party/onnxruntime/lib/libonnxruntime.so* "$CRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu/"
    override-pull: |
      craftctl default
      version="$(sed -n 's/^project(LucidGrasp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
      craftctl set version="$version"