name: lucidgrasp
base: core24
# The version is read from CMakeLists.txt (project(... VERSION ...)) so a
# release only ever has to bump one place. See override-pull below.
adopt-info: lucidgrasp
icon: snap/gui/lucidgrasp.png
license: MIT
summary: High-performance image search engine
description: |
  LucidGrasp is a high-performance image search engine that finds visually
  similar images across local folders or an entire filesystem. It combines
  SSIM structural similarity, ORB keypoint matching, and color histogram
  intersection into a single similarity percentage, and can detect edited
  copies that have been color graded, contrast adjusted, or filtered.
  Indexing and searching run on background threads and stay responsive on
  libraries of any size.

grade: stable
confinement: strict
platforms:
  amd64:

# The `gnome` extension provides the desktop launch wrapper, GTK theming,
# portals and the Mesa/GL stack on core24. Qt itself is staged explicitly
# below (the Qt libraries plus the QPA platform plugins).
apps:
  lucidgrasp:
    command: usr/bin/LucidGrasp
    extensions: [ gnome ]
    desktop: usr/share/applications/io.github.dialga_cmd.LucidGrasp.desktop
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  lucidgrasp:
    plugin: cmake
    # Built from the checked-out release tag by CI, so the snap always matches
    # the source that was released.
    source: .
    build-packages:
      - g++
      - make
      - pkg-config
      - qt6-base-dev
      - libopencv-dev
    # Runtime libraries pulled from the core24 (Ubuntu 24.04) archive so the
    # snap is self-contained. Note the t64 suffix and the .so.406 OpenCV soname.
    # qt6-qpa-plugins is what actually lets a Qt6 GUI start (libqxcb.so and the
    # Wayland plugin); imgcodecs is what imread() needs.
    stage-packages:
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6widgets6t64
      - libqt6network6t64
      - libqt6dbus6t64
      - libqt6opengl6t64
      - qt6-qpa-plugins
      # Platform plugins alone are not enough: Qt6 ships JPEG (and GIF/ICO/…)
      # decoders as image-format *plugins*, and without them the app silently
      # cannot read JPEGs at all.
      - qt6-image-formats-plugins
      - libopencv-core406
      - libopencv-imgproc406
      - libopencv-imgcodecs406
      - libopencv-features2d406
      # OpenCV on Ubuntu links against LAPACK/BLAS, which are not pulled in
      # transitively by the opencv stage-packages. Without these the binary
      # fails to start with "liblapack.so.3: cannot open shared object file".
      - liblapack3
      - libblas3
    # Debian ships BLAS/LAPACK under versioned subdirs and exposes them in the
    # main lib dir via update-alternatives symlinks that only exist after the
    # package's postinst runs. Snapcraft never runs postinst, so the loader
    # (which does search usr/lib/<triplet>) finds only usr/lib/<triplet>/{blas,lapack}.
    # Relocate those files one level up instead of overriding LD_LIBRARY_PATH,
    # which would clobber what the gnome extension sets.
    # See https://forum.snapcraft.io/t/snapcraft-succeeds-but-libblas-so-3-link-cant-be-found-at-runtime/24840
    organize:
      usr/lib/x86_64-linux-gnu/blas/*: usr/lib/x86_64-linux-gnu/
      usr/lib/x86_64-linux-gnu/lapack/*: usr/lib/x86_64-linux-gnu/
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    override-pull: |
      craftctl default
      version="$(sed -n 's/^project(LucidGrasp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
      craftctl set version="$version"