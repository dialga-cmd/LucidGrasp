name: Build and Release

on:
  release:
    types: [published]
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake qt6-base-dev libopencv-dev g++ wget ca-certificates

    - name: Fetch ONNX Runtime
      run: ./fetch-onnxruntime.sh

    - name: Build Project
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)

    - name: Self Test
      run: |
        cd build
        QT_QPA_PLATFORM=offscreen ./LucidGrasp --selftest

    - name: Package Release
      run: |
        mkdir -p package/LucidGrasp
        cp build/LucidGrasp package/LucidGrasp/
        cp -aL third_party/onnxruntime/lib/libonnxruntime.so* package/LucidGrasp/
        cp lucidgrasp.png package/LucidGrasp/
        cp io.github.dialga_cmd.LucidGrasp.desktop package/LucidGrasp/
        cp README.md package/LucidGrasp/
        cp LICENSE package/LucidGrasp/
        cd package
        tar -czvf lucidgrasp-linux-x64.tar.gz LucidGrasp/

    - name: Build AppImage
      run: |
        wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        mkdir -p AppDir/usr/share/applications
        cp build/LucidGrasp AppDir/usr/bin/
        cp lucidgrasp.png AppDir/usr/share/icons/hicolor/256x256/apps/io.github.dialga_cmd.LucidGrasp.png
        cp io.github.dialga_cmd.LucidGrasp.desktop AppDir/usr/share/applications/io.github.dialga_cmd.LucidGrasp.desktop
        cp io.github.dialga_cmd.LucidGrasp.desktop AppDir/
        cp lucidgrasp.png AppDir/io.github.dialga_cmd.LucidGrasp.png
        echo '#!/bin/sh' > AppDir/AppRun
        echo 'exec "$APPDIR/usr/bin/LucidGrasp" "$@"' >> AppDir/AppRun
        chmod +x AppDir/AppRun
        APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir LucidGrasp-x86_64.AppImage

    - name: Upload Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          package/lucidgrasp-linux-x64.tar.gz
          LucidGrasp-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.*'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Install OpenCV
      shell: pwsh
      run: |
        $opencvVersion = "4.10.0"
        $url = "https://github.com/opencv/opencv/releases/download/$opencvVersion/opencv-$opencvVersion-windows.exe"
        Invoke-WebRequest -Uri $url -OutFile opencv-installer.exe
        Start-Process -FilePath .\opencv-installer.exe -ArgumentList "-o`"C:\opencv`" -y" -Wait
        echo "OpenCV_DIR=C:\opencv\opencv\build" >> $env:GITHUB_ENV
        echo "OpenCV_BIN=C:\opencv\opencv\build\x64\vc16\bin" >> $env:GITHUB_ENV

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.29'

    - name: Fetch ONNX Runtime
      shell: pwsh
      run: |
        $version = "1.28.3"
        $url = "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-win-x64-$version.zip"
        Invoke-WebRequest -Uri $url -OutFile onnxruntime.zip
        Expand-Archive -Path onnxruntime.zip -DestinationPath onnxruntime-tmp -Force
        New-Item -ItemType Directory -Path third_party -Force | Out-Null
        Move-Item "onnxruntime-tmp\onnxruntime-win-x64-$version" "third_party\onnxruntime"
        $dll = Get-ChildItem "third_party\onnxruntime" -Recurse -Filter onnxruntime.dll | Select-Object -First 1
        if (-not $dll) { throw "onnxruntime.dll not found in the ONNX Runtime package" }
        "ONNX_RUNTIME_DIR=$($dll.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build Project
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR="$env:OpenCV_DIR"
        nmake

    - name: Self Test
      shell: pwsh
      run: |
        $env:QT_QPA_PLATFORM = "offscreen"
        $env:PATH = "$env:OpenCV_BIN;$env:ONNX_RUNTIME_DIR;$env:PATH"
        .\build\LucidGrasp.exe --selftest
        if ($LASTEXITCODE -ne 0) { throw "Self-test failed (exit code $LASTEXITCODE)" }

    - name: Bundle Dependencies
      shell: pwsh
      run: |
        $dest = "package\LucidGrasp"
        New-Item -ItemType Directory -Path $dest -Force
        Copy-Item build\LucidGrasp.exe $dest\
        Copy-Item lucidgrasp.png $dest\
        Copy-Item README.md $dest\
        Copy-Item LICENSE $dest\
        windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw $dest\LucidGrasp.exe
        Copy-Item "$env:OpenCV_BIN\opencv_world*.dll" $dest\
        Copy-Item "$env:ONNX_RUNTIME_DIR\*.dll" $dest\

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress

    - name: Compile Windows Installer
      shell: pwsh
      run: |
        $cache = Get-Content build\CMakeCache.txt
        $match = $cache | Select-String '^CMAKE_PROJECT_VERSION:STATIC=(.+)$'
        if (-not $match) { throw "CMAKE_PROJECT_VERSION not found in CMakeCache.txt" }
        $version = $match.Matches[0].Groups[1].Value
        (Get-Content installer.iss -Raw) -replace '(?m)^AppVersion=[^\r\n]*', "AppVersion=$version" | Set-Content installer.iss -NoNewline
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Validate Scoop manifest
      if: github.event_name == 'pull_request'
      shell: pwsh
      run: |
        $exe = "package\LucidGrasp_Setup_x64.exe"
        if (-not (Test-Path $exe)) { throw "Installer not found: $exe" }
        $cache = Get-Content build\CMakeCache.txt
        $match = $cache | Select-String '^CMAKE_PROJECT_VERSION:STATIC=(.+)$'
        if (-not $match) { throw "CMAKE_PROJECT_VERSION not found in CMakeCache.txt" }
        $version = $match.Matches[0].Groups[1].Value
        $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash.Length -ne 64) { throw "Bad SHA256 length: $($hash.Length)" }
        $manifest = @{
          version     = "v$version"
          description = "High-performance image search engine built to identify and match visual media."
          homepage    = "https://github.com/dialga-cmd/LucidGrasp"
          url         = "https://github.com/dialga-cmd/LucidGrasp/releases/download/v$version/LucidGrasp_Setup_x64.exe"
          hash        = $hash
          moniker     = "lucidgrasp"
        }
        $json = $manifest | ConvertTo-Json
        $parsed = $json | ConvertFrom-Json
        if ($parsed.hash -ne $hash) { throw "Manifest hash mismatch" }
        Write-Output "Scoop manifest OK for v${version}: $hash"

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          package/LucidGrasp_Setup_x64.exe

  update-scoop:
    if: github.event_name == 'release'
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update Scoop Bucket
      env:
        BUCKET_TOKEN: ${{ secrets.BUCKET_TOKEN }}
      run: |
        set -eu
        TAG=${{ github.event.release.tag_name }}
        VERSION=${TAG#v}
        REPO=${{ github.repository }}
        URL="https://github.com/$REPO/releases/download/$TAG/LucidGrasp_Setup_x64.exe"
        curl -fsSL "$URL" -o setup.exe
        SIZE=$(stat -c%s setup.exe)
        test "$SIZE" -gt 1000000
        HASH=$(sha256sum setup.exe | cut -d' ' -f1)
        cat <<EOF > lucidgrasp.json
        {
          "version": "$VERSION",
          "description": "High-performance image search engine built to identify and match visual media.",
          "homepage": "https://github.com/$REPO",
          "url": "$URL",
          "hash": "$HASH",
          "moniker": "lucidgrasp"
        }
        EOF
        git config --global user.name "dialga-cmd"
        git config --global user.email "adityaraj1234@duck.com"
        git clone https://x-access-token:$BUCKET_TOKEN@github.com/dialga-cmd/lucidgrasp-bucket.git
        cp lucidgrasp.json lucidgrasp-bucket/
        cd lucidgrasp-bucket
        git add lucidgrasp.json
        git commit -m "Update LucidGrasp to $VERSION"
        git push

