name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake qt6-base-dev libopencv-dev g++

    - name: Build Project
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)

    - name: Self Test
      run: |
        cd build
        QT_QPA_PLATFORM=offscreen ./LucidGrasp --selftest

    - name: Package Release
      run: |
        mkdir -p package/LucidGrasp
        cp build/LucidGrasp package/LucidGrasp/
        cp lucidgrasp.png package/LucidGrasp/
        cp lucidgrasp.desktop package/LucidGrasp/
        cp README.md package/LucidGrasp/
        cp LICENSE package/LucidGrasp/
        cd package
        tar -czvf lucidgrasp-linux-x64.tar.gz LucidGrasp/

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: package/lucidgrasp-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        # Qt 6.5 LTS only ships MSVC 2019 (v142) desktop binaries for Windows.
        # There is no win64_msvc2022_64 build for any 6.5.x release, so asking
        # for it makes aqt fall back and fail with
        # "The packages ['qt_base'] were not found".
        version: '6.5.*'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Install OpenCV
      shell: pwsh
      run: |
        $opencvVersion = "4.10.0"
        $url = "https://github.com/opencv/opencv/releases/download/$opencvVersion/opencv-$opencvVersion-windows.exe"
        Invoke-WebRequest -Uri $url -OutFile opencv-installer.exe
        Start-Process -FilePath .\opencv-installer.exe -ArgumentList "-o`"C:\opencv`" -y" -Wait
        echo "OpenCV_DIR=C:\opencv\opencv\build" >> $env:GITHUB_ENV
        # Single definition of where the runtime DLLs live, shared by the self
        # test (which needs them on PATH) and the bundling step (which copies
        # them next to the exe). They used to be written out twice.
        echo "OpenCV_BIN=C:\opencv\opencv\build\x64\vc16\bin" >> $env:GITHUB_ENV

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        # Match the v142 toolset that both Qt 6.5 msvc2019_64 and the OpenCV
        # 4.10.0 vc16 prebuilt binaries were compiled with.
        toolset: '14.29'

    - name: Build Project
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR="$env:OpenCV_DIR"
        nmake

    - name: Self Test
      shell: pwsh
      run: |
        $env:QT_QPA_PLATFORM = "offscreen"
        # OpenCV's DLLs sit in their own bin directory and are not on PATH, and
        # nothing has copied them next to the exe yet -- that happens in the
        # bundling step below. Without this the loader cannot start the process
        # at all, so the step fails with no output and no clue as to why.
        $env:PATH = "$env:OpenCV_BIN;$env:PATH"
        .\build\LucidGrasp.exe --selftest
        if ($LASTEXITCODE -ne 0) {
          # -1073741515 is STATUS_DLL_NOT_FOUND, i.e. the process never ran, as
          # opposed to a test having run and failed.
          throw "Self-test failed (exit code $LASTEXITCODE)"
        }

    - name: Bundle Dependencies
      shell: pwsh
      run: |
        $dest = "package\LucidGrasp"
        New-Item -ItemType Directory -Path $dest -Force
        Copy-Item build\LucidGrasp.exe $dest\
        Copy-Item lucidgrasp.png $dest\
        Copy-Item README.md $dest\
        Copy-Item LICENSE $dest\

        # Run windeployqt to bundle all Qt DLLs, plugins, and platform files
        windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw $dest\LucidGrasp.exe

        # Copy the OpenCV world DLL
        Copy-Item "$env:OpenCV_BIN\opencv_world*.dll" $dest\

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress

    - name: Compile Windows Installer
      shell: pwsh
      run: |
        # Read the version out of the CMake cache rather than keeping a third
        # copy of it: it is already in project(... VERSION ...) and already
        # compiled into the binary, so this makes the installer agree with both
        # instead of drifting from whichever one someone remembers to bump.
        # The entry is CMAKE_PROJECT_VERSION, not PROJECT_VERSION. project()
        # sets PROJECT_VERSION as an ordinary variable, which CMake never
        # writes to the cache, so a search for the bare name finds nothing.
        $cache = Get-Content build\CMakeCache.txt
        $match = $cache | Select-String '^CMAKE_PROJECT_VERSION:STATIC=(.+)$'
        if (-not $match) {
          Write-Host "VERSION entries actually present in CMakeCache.txt:"
          $cache | Select-String 'VERSION' | ForEach-Object { Write-Host "  $_" }
          throw "CMAKE_PROJECT_VERSION not found in CMakeCache.txt"
        }
        $version = $match.Matches[0].Groups[1].Value
        echo "Installer version: $version"

        # [^\r\n]* rather than .*$ because the file is read raw: a greedy .*
        # would swallow the \r of a CRLF line ending and leave the rewritten
        # line with a mismatched terminator.
        (Get-Content installer.iss -Raw) `
          -replace '(?m)^AppVersion=[^\r\n]*', "AppVersion=$version" `
          | Set-Content installer.iss -NoNewline
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: package/LucidGrasp_Setup_x64.exe
