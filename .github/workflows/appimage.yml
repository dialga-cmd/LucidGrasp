name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            qt6-base-dev \
            libopencv-dev \
            binutils \
            wget \
            ca-certificates

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build LucidGrasp
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          cp build/LucidGrasp AppDir/usr/bin/
          cp lucidgrasp.png AppDir/usr/share/icons/hicolor/256x256/apps/io.github.dialga_cmd.LucidGrasp.png
          cp io.github.dialga_cmd.LucidGrasp.desktop AppDir/usr/share/applications/io.github.dialga_cmd.LucidGrasp.desktop

          # appimagetool does NOT look in usr/share for either of these. It
          # globs the AppDir ROOT non-recursively for *.desktop, then looks for
          # <Icon>.png in that same root, and exits with "Desktop file not
          # found, aborting" otherwise. Both copies are wanted: the root ones
          # for appimagetool, the usr/share ones for desktop integration.
          cp io.github.dialga_cmd.LucidGrasp.desktop AppDir/
          cp lucidgrasp.png AppDir/io.github.dialga_cmd.LucidGrasp.png

          # Create AppRun script
          echo '#!/bin/sh' > AppDir/AppRun
          echo 'exec "$APPDIR/usr/bin/LucidGrasp" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Package AppImage
        run: |
          # appimagetool is itself an AppImage, and the runner has no
          # libfuse.so.2, so a plain run dies with "dlopen(): error loading
          # libfuse.so.2 / AppImages require FUSE to run" before it ever looks
          # at the AppDir. APPIMAGE_EXTRACT_AND_RUN unpacks to a temp dir and
          # executes instead of mounting, which needs no FUSE at all.
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir LucidGrasp-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LucidGrasp-AppImage
          path: LucidGrasp-x86_64.AppImage
