name: Verify Launchpad GPG passphrase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: GPG unlock check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import signing key
        env:
          GPG_KEY: ${{ secrets.LAUNCHPAD_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "$GPG_KEY" ]; then
            echo "LAUNCHPAD_GPG_KEY is empty"
            exit 1
          fi
          if [ -z "$GPG_PASSPHRASE" ]; then
            echo "LAUNCHPAD_GPG_PASSPHRASE is empty"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          printf '%s\n' \
            "pinentry-mode loopback" \
            "passphrase-file $GNUPGHOME/passphrase" \
            "batch" > "$GNUPGHOME/gpg.conf"
          printf '%s\n' "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent || true
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Sign test file
        run: |
          set -eu
          printf 'lucidgrasp passphrase check\n' > sign-test.txt
          gpg --batch --yes --detach-sign --default-key 516C7A148DFC4221CFD3B3BE43B17F39DD2E30C1 sign-test.txt
          gpg --batch --verify sign-test.txt.sig sign-test.txt
          rm -f sign-test.txt sign-test.txt.sig
          echo "PASSPHRASE OK - key unlocked and signature verified"