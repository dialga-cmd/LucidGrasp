name: Publish to Launchpad PPA

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to Launchpad (otherwise dry-run)"
        type: boolean
        default: false
      version:
        description: "Upstream version (default: current changelog version)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: launchpad-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  LP_GPG_KEY_ID: "516C7A148DFC4221CFD3B3BE43B17F39DD2E30C1"
  LP_PPA: "ppa:realdialga/lucidgrasp"

jobs:
  launchpad:
    name: Launchpad PPA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts dpkg-dev debhelper make fakeroot dput

      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ver="${{ github.event.release.tag_name }}"
            ver="${ver#v}"
          else
            ver="${{ inputs.version }}"
            if [ -z "$ver" ]; then
              ver="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
            fi
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building upstream version $ver"

      - name: Import signing key
        if: github.event_name == 'release' || inputs.publish == true
        env:
          GPG_KEY: ${{ secrets.LAUNCHPAD_GPG_KEY }}
        run: |
          set -eu
          if [ -z "$GPG_KEY" ]; then
            echo "LAUNCHPAD_GPG_KEY is empty"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          umask 077
          printf '%s' "${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}" > "$GNUPGHOME/passphrase"
          printf '%s\n' \
            "pinentry-mode loopback" \
            "passphrase-file $GNUPGHOME/passphrase" \
            "batch" > "$GNUPGHOME/gpg.conf"
          printf '%s\n' "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent || true
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf 'ci-signing-preflight\n' | gpg --batch --clearsign > /dev/null

      - name: Build source package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          DEBFULLNAME: dialga-cmd
          DEBEMAIL: adityaraj1234@duck.com
        run: |
          set -eu
          work="$PWD/pkg"
          mkdir -p "$work"
          git archive --format=tar --prefix="lucidgrasp-${VERSION}/" HEAD \
            | tar -x -C "$work"
          git archive --format=tar --prefix="lucidgrasp-${VERSION}/" HEAD \
            -- . ':(exclude)debian' | gzip -9n > "$work/lucidgrasp_${VERSION}.orig.tar.gz"
          cd "$work/lucidgrasp-${VERSION}"
          debchange \
            --newversion "${VERSION}-1" \
            --force-bad-version \
            --distribution noble \
            --force-distribution \
            --urgency medium \
            -m "Release ${RELEASE_TAG}"
          dpkg-buildpackage -S -sa -us -uc -d

      - name: Sign source package
        if: github.event_name == 'release' || inputs.publish == true
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          cd pkg
          debsign -k"$LP_GPG_KEY_ID" "lucidgrasp_${VERSION}-1_source.changes"

      - name: Upload to Launchpad
        if: github.event_name == 'release' || inputs.publish == true
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          cd pkg
          dput "$LP_PPA" "lucidgrasp_${VERSION}-1_source.changes"

      - name: Dry-run note
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish != true)
        run: |
          echo "::notice::Dry-run complete - source package built, not signed or uploaded."
