name: OBS Package

on:
  release:
    types: [published]
  pull_request:

permissions:
  contents: write

concurrency:
  group: obs-${{ github.ref }}
  cancel-in-progress: true

env:
  OBS_PROJECT: home:dialga-cmd
  OBS_PACKAGE: lucidgrasp

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev libopencv-dev g++ make rpm debugedit

      - name: Validate packaging consistency
        run: |
          set -eu
          sv="$(sed -n 's/.*<param name="version">\([^<]*\)<\/param>.*/\1/p' _service)"
          pv="$(sed -n 's/^Version:[[:space:]]*//p' lucidgrasp.spec)"
          cv="$(sed -n '2s/.* - \([0-9][0-9.]*\)$/\1/p' lucidgrasp.changes)"
          test -n "$sv"
          test "$sv" = "$pv"
          test "$sv" = "$cv"
          sep="$(sed -n '1p' lucidgrasp.changes)"
          test "$(printf '%s' "$sep" | tr -cd '-' | wc -c)" -ge 60
          sed -n '2p' lucidgrasp.changes | grep -Eq '^[A-Z][a-z]{2} [A-Z][a-z]{2} [0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} UTC [0-9]{4} - dialga-cmd <adityaraj1234@duck.com> - [0-9.]+$'
          sed -n '3p' lucidgrasp.changes | grep -Eq '^\- '
          grep -q 'LucidGrasp-%{version}.tar.gz' lucidgrasp.spec
          grep -q '%setup -q -n LucidGrasp-%{version}' lucidgrasp.spec
          rev="$(sed -n 's/.*<param name="revision">\([^<]*\)<\/param>.*/\1/p' _service)"
          test -n "$rev"
          printf '%s' "$rev" | grep -Eq '^(main|v[0-9])'

      - name: Build RPM locally
        run: |
          set -eu
          sv="$(sed -n 's/.*<param name="version">\([^<]*\)<\/param>.*/\1/p' _service)"
          top="$HOME/rpmbuild"
          rm -rf "$top"
          mkdir -p "$top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive --format=tar --prefix="LucidGrasp-$sv/" HEAD | gzip -c > "$top/SOURCES/LucidGrasp-$sv.tar.gz"
          cp lucidgrasp.spec "$top/SPECS/"
          rpmbuild -bb \
            --define "_topdir $top" \
            --define "_build_id_links none" \
            "$top/SPECS/lucidgrasp.spec"
          find "$top/RPMS" -name '*.rpm' -print -quit | grep -q .

  publish:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Derive version from tag
        id: ver
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Bump packaging files
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"
          top_ver="$(sed -n '2s/.* - \([0-9][0-9.]*\)$/\1/p' lucidgrasp.changes)"
          sed -i "s|<param name=\"version\">[^<]*</param>|<param name=\"version\">$version</param>|" _service
          sed -i "s|<param name=\"revision\">[^<]*</param>|<param name=\"revision\">$tag</param>|" _service
          sed -i "s|^Version:.*|Version:        $version|" lucidgrasp.spec
          if [ "$top_ver" != "$version" ]; then
            date_line="$(date -u '+%a %b %-d %H:%M:%S UTC %Y')"
            {
              sed -n '1p' lucidgrasp.changes
              printf '%s - dialga-cmd <adityaraj1234@duck.com> - %s\n' "$date_line" "$version"
              printf '%s\n' "- Release $tag"
              printf '\n'
              cat lucidgrasp.changes
            } > .changes.new
            mv .changes.new lucidgrasp.changes
          fi

      - name: Commit and push packaging update
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _service lucidgrasp.spec lucidgrasp.changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump OBS packaging to v$version"
            git push origin main
          fi

      - name: Install osc
        run: |
          sudo apt-get update
          sudo apt-get install -y osc

      - name: Push sources to OBS
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASS: ${{ secrets.OBS_PASS }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          mkdir -p "$HOME/.config/osc"
          cat > "$HOME/.config/osc/oscrc" <<EOF
          [general]
          apiurl = https://api.opensuse.org

          [https://api.opensuse.org]
          user = ${OBS_USER}
          pass = ${OBS_PASS}
          email = adityaraj1234@duck.com
          EOF
          export OSC_CONFIG="$HOME/.config/osc/oscrc"
          osc checkout "$OBS_PROJECT/$OBS_PACKAGE"
          cd "$OBS_PROJECT/$OBS_PACKAGE"
          cp "$GITHUB_WORKSPACE/_service" .
          cp "$GITHUB_WORKSPACE/lucidgrasp.spec" .
          cp "$GITHUB_WORKSPACE/lucidgrasp.changes" .
          osc addremove
          osc ci -m "Bump LucidGrasp to $VERSION ($TAG)"

      - name: Trigger OBS service run
        if: secrets.OBS_TOKEN != ''
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Token $OBS_TOKEN" \
            "https://api.opensuse.org/trigger/runservice?project=$OBS_PROJECT&package=$OBS_PACKAGE"