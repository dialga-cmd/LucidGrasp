name: Publish to Snap Store

on:
  release:
    types: [published]
  pull_request:
  schedule:
    # Monthly rebuild of the latest release so security updates in the Ubuntu
    # archive are picked up even when no new release has been cut.
    - cron: '23 3 1 * *'
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to the Snap Store (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snap-release
  cancel-in-progress: false

jobs:
  snap:
    name: Snap Store
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve build ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
            if [ -z "$ref" ]; then
              echo "No GitHub release found to rebuild" >&2
              exit 1
            fi
          else
            ref="${{ github.event.release.tag_name || github.ref }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Inspect snap contents
        run: |
          snap_path="${{ steps.build.outputs.snap }}"
          sudo apt-get install -y -qq squashfs-tools
          echo "--- lapack/blas entries inside the snap ---"
          unsquashfs -ll "$snap_path" 2>/dev/null | grep -Ei 'lapack|blas' || echo "(none present)"
          echo "--- shared libs staged in usr/lib/x86_64-linux-gnu ---"
          unsquashfs -ll "$snap_path" 2>/dev/null | grep -c 'usr/lib/x86_64-linux-gnu'

      - name: Upload snap artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: snap-${{ github.sha }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: Verify the snap runs
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo snap connect lucidgrasp:home || true
          echo "--- unresolved libraries (if any) ---"
          snap run --shell lucidgrasp -c 'echo LD_LIBRARY_PATH="$LD_LIBRARY_PATH"; ldd "$SNAP/usr/bin/LucidGrasp" | grep "not found" || echo none'
          echo "--- Qt plugin discovery inside the snap namespace ---"
          snap run --shell lucidgrasp -c 'env | grep -i "^QT" | sort; echo "QLibraryInfo default: /usr/lib/x86_64-linux-gnu/qt6/plugins ->"; ls -d /usr/lib/x86_64-linux-gnu/qt6/plugins 2>&1; echo "staged:"; ls "$SNAP/usr/lib/x86_64-linux-gnu/qt6/plugins" 2>&1'
          QT_QPA_PLATFORM=offscreen snap run lucidgrasp --selftest
          echo "--- self-test corpus (left behind on purpose) ---"
          snap run --shell lucidgrasp -c 'ls -la /tmp/lucidgrasp_selftest_*/library 2>&1'

      - name: Publish snap
        if: github.event_name == 'release' || github.event_name == 'schedule' || inputs.publish == true
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable