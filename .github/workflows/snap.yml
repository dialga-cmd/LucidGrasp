name: Publish to Snap Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to the Snap Store (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snap-release
  cancel-in-progress: false

jobs:
  snap:
    name: Snap Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Inspect snap contents
        run: |
          snap_path="${{ steps.build.outputs.snap }}"
          sudo apt-get install -y -qq squashfs-tools
          echo "--- lapack/blas entries inside the snap ---"
          unsquashfs -ll "$snap_path" 2>/dev/null | grep -Ei 'lapack|blas' || echo "(none present)"
          echo "--- shared libs staged in usr/lib/x86_64-linux-gnu ---"
          unsquashfs -ll "$snap_path" 2>/dev/null | grep -c 'usr/lib/x86_64-linux-gnu'

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ github.sha }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: Verify the snap runs
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo snap connect lucidgrasp:home || true
          echo "--- unresolved libraries (if any) ---"
          snap run --shell lucidgrasp -c 'echo LD_LIBRARY_PATH="$LD_LIBRARY_PATH"; ldd "$SNAP/usr/bin/LucidGrasp" | grep "not found" || echo none'
          # Boots the whole app (indexing + matching) headless.
          QT_QPA_PLATFORM=offscreen snap run lucidgrasp --selftest

      - name: Publish snap
        if: github.event_name == 'release' || inputs.publish == true
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable